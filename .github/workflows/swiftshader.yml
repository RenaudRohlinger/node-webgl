name: swiftshader
# Builds SwiftShader's Vulkan driver at the revision Chrome bundles and packages it as
# @onirenaud/swiftshader-vulkan (packages/swiftshader-vulkan). Run manually; publishes when asked to.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages/swiftshader-vulkan to npm (needs NPM_TOKEN)
        type: boolean
        default: false
env:
  SWIFTSHADER_REVISION: 5b0479bd2d15058aaa9eb490e364f920ff824a8c
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, backend: Subzero }
          - { os: ubuntu-24.04-arm, target: linux-arm64, backend: LLVM }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: google/swiftshader
          ref: ${{ env.SWIFTSHADER_REVISION }}
          submodules: recursive
          path: swiftshader
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang lld
      - name: Configure
        run: >
          cmake -S swiftshader -B swiftshader/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DREACTOR_BACKEND=${{ matrix.backend }}
          -DSWIFTSHADER_BUILD_TESTS=OFF -DSWIFTSHADER_BUILD_BENCHMARKS=OFF
          -DSWIFTSHADER_BUILD_PVR=OFF -DSWIFTSHADER_BUILD_WSI_XCB=OFF -DSWIFTSHADER_BUILD_WSI_WAYLAND=OFF
          -DSWIFTSHADER_WARNINGS_AS_ERRORS=OFF
      - run: ninja -C swiftshader/build vk_swiftshader
      - name: Collect
        run: |
          mkdir -p out/${{ matrix.target }}
          cp swiftshader/build/Linux/libvk_swiftshader.so swiftshader/build/Linux/vk_swiftshader_icd.json out/${{ matrix.target }}/
          strip --strip-unneeded out/${{ matrix.target }}/libvk_swiftshader.so
          cat out/${{ matrix.target }}/vk_swiftshader_icd.json; ls -la out/${{ matrix.target }}
      - name: Smoke test (vulkaninfo)
        run: |
          sudo apt-get install -y vulkan-tools libvulkan1
          VK_DRIVER_FILES=$PWD/out/${{ matrix.target }}/vk_swiftshader_icd.json vulkaninfo --summary | grep -E "deviceName|driverName|apiVersion"
      - uses: actions/upload-artifact@v4
        with:
          name: swiftshader-${{ matrix.target }}
          path: out/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - uses: actions/download-artifact@v4
        with:
          pattern: swiftshader-*
          merge-multiple: true
          path: packages/swiftshader-vulkan
      - run: ls -laR packages/swiftshader-vulkan && node -e "import('./packages/swiftshader-vulkan/index.js').then(m => console.log(m.icdPath()))"
      - name: Pack
        run: cd packages/swiftshader-vulkan && npm pack && ls -la *.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: swiftshader-vulkan-npm
          path: packages/swiftshader-vulkan/*.tgz
      - name: Publish
        if: ${{ inputs.publish }}
        run: cd packages/swiftshader-vulkan && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
